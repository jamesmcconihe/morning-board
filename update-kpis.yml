name: Refresh KPI data

on:
  schedule:
    # Every 15 minutes, weekdays, 11:00–23:00 UTC (4am–4pm Pacific).
    # GitHub often runs scheduled jobs late — treat 15 min as "about 15 min".
    - cron: '*/15 11-23 * * 1-5'
    # One weekend refresh so the board isn't two days stale on Monday morning.
    - cron: '0 14 * * 6,0'
  workflow_dispatch:        # adds a "Run workflow" button you can press yourself

permissions:
  contents: write           # lets the job commit the refreshed data file

concurrency:
  group: kpi-refresh        # never two refreshes at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the numbers
        run: node scripts/update-kpis.mjs

      - name: Save them back to the repo
        run: |
          git config user.name "kpi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kpis.json
          if git diff --staged --quiet; then
            echo "Nothing changed since the last run."
          else
            git commit -m "KPI refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
